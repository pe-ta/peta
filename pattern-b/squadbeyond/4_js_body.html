<script>
  (function () {
    'use strict';

    var IMG_BASE = 'https://file.mysquadbeyond.com/uploads/article_photo/photo/';
    var IMG = {
      fv: IMG_BASE + '7283345/8997a1c0-fc32-4543-af08-982e31120714.png',
      coupon: IMG_BASE + '7283347/5302099b-a697-454b-b732-e9eaa4af3d14.png',
      explain1: IMG_BASE + '7130693/31096c58-8cb7-415c-a4ae-94cb605f9d66.png',
      explain2: IMG_BASE + '7130711/39490604-f998-4327-88d9-a4fdd186d8f3.png',
      explain3: IMG_BASE + '7130726/a85943e2-8215-4c2c-a37d-8443a1793226.jpg',
      lineCta: IMG_BASE + '7275483/13cb84a1-99ea-4c9b-a76b-461b2262401f.png'
    };

    // 診断タイプ別のLINEオファーURL（現行LPと同一）
    var LINE_BASE = 'https://liff.line.me/2008012979-MBmEj213?channel_id=e39ad12e-58e6-48c5-bd2c-725427ee7bf8&liff_id=2008012979-MBmEj213&redirect_uri=https%3A%2F%2Fline.me%2FR%2Fti%2Fp%2F%40203pbdac&tenant_id=alifexoqodovexuz&inflow_route_id=';
    var OFFER_URLS = {
      kasei: LINE_BASE + '6ab61d2d56e5d9f13158452f',   // 仮性：診断85％オファー
      kanton: LINE_BASE + '6ab61d3b74dfcf23670e6895',  // カントン：診断90％オファー
      shinsei: LINE_BASE + '6ab61d4a74dfcf23670e68c0'  // 真性：診断95％オファー
    };

    var answers = { q1: null, q2: null, q3: null };
    var completed = false;

    function getSegment() {
      if (answers.q1 === 'no') return 'shinsei';
      if (answers.q2 === 'yes') return 'kanton';
      return 'kasei';
    }

    // 流入時のクエリパラメータをLINEのURLへ引き継ぐ
    function buildLineUrl() {
      var url = new URL(OFFER_URLS[getSegment()]);
      new URLSearchParams(location.search).forEach(function (v, k) {
        if (!url.searchParams.has(k)) url.searchParams.append(k, v);
      });
      return url.toString();
    }

    function track(event, extra) {
      window.dataLayer = window.dataLayer || [];
      var data = { event: event };
      for (var k in extra) data[k] = extra[k];
      window.dataLayer.push(data);
    }

    var thread = document.getElementById('chatThread');
    var answerArea = document.getElementById('chatAnswer');
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function wait(ms) {
      return new Promise(function (r) { setTimeout(r, reduceMotion ? 0 : ms); });
    }

    function scrollToLatest() {
      var target = answerArea.childElementCount ? answerArea : thread.lastElementChild;
      if (!target) return;
      var overflow = target.getBoundingClientRect().bottom - window.innerHeight + 16;
      if (overflow > 0) window.scrollBy({ top: overflow, behavior: reduceMotion ? 'auto' : 'smooth' });
    }

    // 進捗バー（step: 0=開始前, 1〜3=各質問, 4=完了）
    function setProgress(step) {
      var label = document.getElementById('progressLabel');
      var rest = document.getElementById('progressRest');
      var fill = document.getElementById('progressFill');
      fill.style.width = [5, 25, 55, 80, 100][step] + '%';
      if (step === 0) {
        label.textContent = 'セルフチェック';
        rest.innerHTML = '残り<b>3</b>問';
      } else if (step < 4) {
        label.textContent = 'Q' + step + ' / 3';
        rest.innerHTML = step === 3 ? '<b>あと1問で完了！</b>' : '残り<b>' + (4 - step) + '</b>問';
      } else {
        label.textContent = '診断完了';
        rest.innerHTML = '<b>結果はLINEで確認</b>';
      }
    }

    var ICON = '<div class="chat__icon" aria-hidden="true"><svg viewBox="0 0 40 40"><circle cx="20" cy="15" r="7" fill="#1a3a6b"/><path d="M6 36c1.5-8 7-12 14-12s12.5 4 14 12z" fill="#2f6fed"/><path d="M17 24l3 5 3-5" fill="#fff"/><rect x="24" y="27" width="6" height="2" rx="1" fill="#fff"/></svg></div>';
    var LINE_ICON = '<svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#fff"/><path d="M20 9c-7.2 0-13 4.6-13 10.3 0 5.1 4.6 9.4 10.8 10.2.4.1 1 .3 1.1.7.1.4.1.9 0 1.3l-.2 1.1c-.1.3-.3 1.3 1.1.7s7.7-4.5 10.5-7.8C31.2 23.4 33 21.5 33 19.3 33 13.6 27.2 9 20 9z" fill="#06c755"/></svg>';

    function img(src, alt, size) {
      return '<img src="' + src + '" alt="' + (alt || '') + '"' + (size ? ' data-size="' + size + '"' : '') + ' decoding="async">';
    }

    async function say(html, opts) {
      opts = opts || {};
      var box = document.createElement('div');
      box.className = 'chat__box';
      box.innerHTML = ICON + '<div class="chat__item"><div class="typing"><span></span><span></span><span></span></div></div>';
      thread.appendChild(box);
      scrollToLatest();
      await wait(opts.typing || 600);
      var item = box.querySelector('.chat__item');
      if (opts.image) item.classList.add('chat__item--img');
      item.innerHTML = html;
      item.querySelectorAll('img').forEach(function (el) {
        el.addEventListener('load', scrollToLatest, { once: true });
      });
      scrollToLatest();
      await wait(opts.after || 300);
    }

    function sayImage(html, opts) {
      opts = opts || {};
      opts.image = true;
      opts.typing = opts.typing || 400;
      return say(html, opts);
    }

    function reply(text) {
      var box = document.createElement('div');
      box.className = 'chat__box';
      box.dataset.state = 'user';
      var item = document.createElement('div');
      item.className = 'chat__item';
      item.dataset.state = 'user';
      item.textContent = text;
      box.appendChild(item);
      thread.appendChild(box);
      scrollToLatest();
    }

    function ask(options, hint) {
      return new Promise(function (resolve) {
        var list = document.createElement('div');
        list.className = 'chat__answer__list';
        if (hint) {
          var p = document.createElement('p');
          p.className = 'chat__answer__hint';
          p.textContent = hint;
          list.appendChild(p);
        }
        options.forEach(function (opt) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'chat__answer__item';
          btn.textContent = opt.label;
          btn.addEventListener('click', function () {
            answerArea.innerHTML = '';
            reply(opt.label);
            resolve(opt);
          }, { once: true });
          list.appendChild(btn);
        });
        answerArea.innerHTML = '';
        answerArea.appendChild(list);
        scrollToLatest();
      });
    }

    function lineButton(id) {
      return '<a' + (id ? ' id="' + id + '"' : '') + ' class="line-btn" href="' + buildLineUrl() + '" data-segment="' + getSegment() + '">' +
        LINE_ICON + '<span>LINEで診断結果を受け取る<small>＋55%OFFクーポン付き</small></span></a>';
    }

    var stickyCta = document.getElementById('stickyCta');

    function showLineCta() {
      var wrap = document.createElement('div');
      wrap.className = 'cta';
      wrap.innerHTML =
        '<p class="cta__lead">タップするだけで<br><b>診断結果</b>と<b>55%OFFクーポン</b>が届きます</p>' +
        '<p class="cta__arrows" aria-hidden="true">▼▼▼</p>' +
        '<a id="line-cta" class="img-btn" href="' + buildLineUrl() + '" data-segment="' + getSegment() + '">' +
        img(IMG.lineCta, '55％OFFクーポン付き LINE追加で診断結果を受け取る') + '</a>' +
        lineButton('line-cta-text') +
        '<p class="cta__note">セルフチェックは無料です。<br>クーポンと診断結果を受け取るにはLINE友だち追加が必要です。</p>';
      answerArea.innerHTML = '';
      answerArea.appendChild(wrap);

      // 結果エリアが画面外のときは追従CTAを表示
      stickyCta.innerHTML = lineButton('line-cta-sticky');
      if ('IntersectionObserver' in window) {
        new IntersectionObserver(function (entries) {
          var visible = entries[0].isIntersecting;
          stickyCta.classList.toggle('show', !visible);
          stickyCta.setAttribute('aria-hidden', visible ? 'true' : 'false');
        }).observe(wrap);
      }
      scrollToLatest();
    }

    document.addEventListener('click', function (e) {
      var a = e.target.closest('a[data-segment]');
      if (a) track('line_cta_click', { segment: a.dataset.segment, position: a.id });
    });

    var CONCERN = {
      soro: { label: '早さ', msg: '「早さ」のお悩みも、包茎の状態とあわせてご相談いただけます。' },
      smell: { label: 'ニオイ', msg: '「ニオイ」や衛生面のお悩みも、包茎の状態とあわせてご相談いただけます。' },
      confidence: { label: '自信', msg: '「自信が持てない」というお悩みも、まずは今の状態を知ることが第一歩です。' },
      risk: { label: '病気のリスク', msg: '「病気のリスク」が気になる方こそ、早めに今の状態を確認しておくと安心です。' }
    };

    async function start() {
      setProgress(0);
      track('selfcheck_view');
      await sayImage(img(IMG.fv, 'メンズライフクリニック', 's'), { typing: 300, after: 200 });
      await say('こんなお悩み、ありませんか？' +
        '<ul class="worry-list">' +
        '<li>パートナーの視線が気になり、自信が持てない</li>' +
        '<li>ニオイなど衛生面が不安</li>' +
        '<li>プールや温泉で周囲の目が気になる</li>' +
        '</ul>' +
        '<span class="t-blue">1つでも当てはまったら、今すぐセルフチェック！</span>' +
        '<div class="benefits"><span><b>3問</b>だけ</span><span><b>30秒</b>で完了</span><span><b>55%OFF</b>クーポン</span></div>',
        { typing: 700 });

      // Q1
      setProgress(1);
      await say('<span class="q-label">Q1</span><br><span class="q-text">普段、皮はかぶっているが、剥くことはできますか？</span>', { typing: 500, after: 0 });
      var a1 = await ask([{ label: 'はい', value: 'yes' }, { label: 'いいえ', value: 'no' }], 'タップで回答（30秒で完了）');
      answers.q1 = a1.value;
      track('selfcheck_answer', { question: 'q1', answer: a1.value });
      await sayImage(img(IMG.explain1, 'オーダーメイドの施術'));
      await say('皮の余り方や形状は一人ひとり異なります。<br>熟練のスタッフがミリ単位で微調整する<span class="marker">「オーダーメイド」</span>で、自然な仕上がりを目指します。');

      // Q2
      setProgress(2);
      await say('<span class="q-label">Q2</span><br><span class="q-text">露茎した際に、締め付けを感じますか？</span>', { typing: 500, after: 0 });
      var a2 = await ask([{ label: 'はい', value: 'yes' }, { label: 'いいえ', value: 'no' }]);
      answers.q2 = a2.value;
      track('selfcheck_answer', { question: 'q2', answer: a2.value });
      await sayImage(img(IMG.explain2, '締め付け感について'));
      await say('締め付け感がある方は<span class="t-red">重症化リスクの可能性</span>があるため、無理に剥かないようにしてください。<br><span class="t-blue">次が最後の質問です！</span>');

      // Q3
      setProgress(3);
      await say('<span class="q-label">Q3</span><br><span class="q-text">一番気になるお悩みは？</span>', { typing: 500, after: 0 });
      var a3 = await ask([
        { label: '早漏を改善したい', value: 'soro' },
        { label: '臭いが気になる', value: 'smell' },
        { label: '自信を持てない', value: 'confidence' },
        { label: '病気のリスク', value: 'risk' }
      ], 'あと1問で診断完了！');
      answers.q3 = a3.value;
      track('selfcheck_answer', { question: 'q3', answer: a3.value });

      // 結果
      setProgress(4);
      completed = true;
      track('selfcheck_complete', { segment: getSegment(), concern: a3.value });
      await say('<span class="t-big t-blue">診断が完了しました！</span><br>' + CONCERN[a3.value].msg, { typing: 1200 });
      await say('あなたの診断結果' +
        '<div class="result-card">' +
        '<p class="result-card__head">セルフチェック結果</p>' +
        '<div class="result-card__body">' +
        '<p class="result-card__row"><span>剥けるか</span><span>' + a1.label + '</span></p>' +
        '<p class="result-card__row"><span>締め付け</span><span>' + a2.label + '</span></p>' +
        '<p class="result-card__row"><span>気になるお悩み</span><span>' + CONCERN[a3.value].label + '</span></p>' +
        '<p class="result-card__row result-card__row--locked"><span>包茎タイプ</span><span>●●●●●タイプ</span></p>' +
        '<p class="result-card__row result-card__row--locked"><span>治療推奨レベル</span><span>●●%</span></p>' +
        '<p class="result-card__lock">🔒 包茎タイプと治療推奨レベルは<br>LINEでお届けします</p>' +
        '</div></div>', { typing: 900 });
      await sayImage(img(IMG.explain3, '完全プライベート空間'));
      await say('完全プライベート空間・<span class="marker">スタッフは全員男性</span>なので、デリケートなお悩みも安心してご相談いただけます。');
      await sayImage(img(IMG.coupon, '55%OFF LINE限定クーポン', 's'), { after: 200 });
      showLineCta();
    }

    // 離脱防止ポップアップ（ブラウザバック時に1回だけ表示）
    var exitPopup = document.getElementById('exitPopup');
    var exitShown = false;
    try { history.pushState({ mlc: 1 }, '', location.href); } catch (e) { }
    window.addEventListener('popstate', function () {
      if (exitShown) return;
      exitShown = true;
      var title = document.getElementById('exitTitle');
      var text = document.getElementById('exitText');
      var action = document.getElementById('exitAction');
      if (completed) {
        title.innerHTML = '診断結果を<br>受け取らずに戻りますか？';
        text.innerHTML = 'あなたの<b>診断結果</b>と<br><b class="t-red">55%OFFクーポン</b>の準備ができています。';
        action.innerHTML = '<a class="exit__cta" href="' + buildLineUrl() + '" data-segment="' + getSegment() + '" id="line-cta-exit">LINEで受け取る</a>';
      } else {
        title.innerHTML = 'お悩みのまま<br>本当に大丈夫ですか？';
        text.innerHTML = '今なら<b>たった30秒のセルフチェック</b>で<br>あなたの包茎タイプと<br><b class="t-red">55%OFFクーポン</b>を<br>LINEでお受け取りいただけます。';
        action.innerHTML = '<button type="button" class="exit__cta" data-exit-close>セルフチェックを続ける</button>';
      }
      exitPopup.classList.add('show');
      track('exit_popup_view', { completed: completed });
      try { history.pushState({ mlc: 1 }, '', location.href); } catch (e) { }
    });
    exitPopup.addEventListener('click', function (e) {
      if (!e.target.closest('[data-exit-close]')) return;
      exitPopup.classList.remove('show');
      scrollToLatest();
    });

    start();
  })();
</script>
