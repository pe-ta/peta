<script>
  (function () {
    'use strict';

    var IMG_BASE = 'https://file.mysquadbeyond.com/uploads/article_photo/photo/';
    var IMG = {
      fv: IMG_BASE + '7283345/8997a1c0-fc32-4543-af08-982e31120714.png',
      coupon: IMG_BASE + '7283347/5302099b-a697-454b-b732-e9eaa4af3d14.png',
      start: IMG_BASE + '7275481/ba5172ba-555c-4659-9bad-a728fe98f25c.png',
      explain1a: IMG_BASE + '7130699/fc3bf45b-7b6d-4f9e-852a-4d2d4b03b2d4.jpg',
      explain1b: IMG_BASE + '7130693/31096c58-8cb7-415c-a4ae-94cb605f9d66.png',
      explain2a: IMG_BASE + '7130711/39490604-f998-4327-88d9-a4fdd186d8f3.png',
      explain2b: IMG_BASE + '7130718/d06938a2-b91e-4e73-96fc-a13a13136061.jpg',
      explain3a: IMG_BASE + '7130726/a85943e2-8215-4c2c-a37d-8443a1793226.jpg',
      explain3b: IMG_BASE + '7130762/d87a6e7d-06ef-44d9-9e68-bb8269cedb2c.png',
      result: IMG_BASE + '7115893/3010b16b-04d6-4c33-99ba-3f225289fb35.png',
      lineCta: IMG_BASE + '7275483/13cb84a1-99ea-4c9b-a76b-461b2262401f.png'
    };

    // 診断タイプ別のLINEオファーURL（現行LPと同一）
    var LINE_BASE = 'https://liff.line.me/2008012979-MBmEj213?channel_id=e39ad12e-58e6-48c5-bd2c-725427ee7bf8&liff_id=2008012979-MBmEj213&redirect_uri=https%3A%2F%2Fline.me%2FR%2Fti%2Fp%2F%40203pbdac&tenant_id=alifexoqodovexuz&inflow_route_id=';
    var OFFER_URLS = {
      kasei: LINE_BASE + '6ab61d2d56e5d9f13158452f',   // 仮性：診断85％オファー
      kanton: LINE_BASE + '6ab61d3b74dfcf23670e6895',  // カントン：診断90％オファー
      shinsei: LINE_BASE + '6ab61d4a74dfcf23670e68c0'  // 真性：診断95％オファー
    };

    var answers = { q1: null, q2: null, q3: null };

    function getSegment() {
      if (answers.q1 === 'no') return 'shinsei';
      if (answers.q2 === 'yes') return 'kanton';
      return 'kasei';
    }

    // 流入時のクエリパラメータをLINEのURLへ引き継ぐ
    function buildLineUrl(seg) {
      var url = new URL(OFFER_URLS[seg]);
      new URLSearchParams(location.search).forEach(function (v, k) {
        if (!url.searchParams.has(k)) url.searchParams.append(k, v);
      });
      return url.toString();
    }

    var thread = document.getElementById('chatThread');
    var answerArea = document.getElementById('chatAnswer');
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function wait(ms) {
      return new Promise(function (r) { setTimeout(r, reduceMotion ? 0 : ms); });
    }

    function scrollToLatest() {
      var target = answerArea.childElementCount ? answerArea : thread.lastElementChild;
      if (!target) return;
      var rect = target.getBoundingClientRect();
      var overflow = rect.bottom - window.innerHeight + 24;
      if (overflow > 0) window.scrollBy({ top: overflow, behavior: reduceMotion ? 'auto' : 'smooth' });
    }

    var ICON = '<div class="chat__icon" aria-hidden="true"><svg viewBox="0 0 40 40"><circle cx="20" cy="15" r="7" fill="#1a3a6b"/><path d="M6 36c1.5-8 7-12 14-12s12.5 4 14 12z" fill="#2f6fed"/><path d="M17 24l3 5 3-5" fill="#fff"/><rect x="24" y="27" width="6" height="2" rx="1" fill="#fff"/></svg></div>';

    function img(src, alt, size) {
      return '<img src="' + src + '" alt="' + (alt || '') + '"' + (size ? ' data-size="' + size + '"' : '') + ' loading="eager" decoding="async">';
    }

    // スタッフ側メッセージ（入力中アニメーション → 表示）
    async function say(html, opts) {
      opts = opts || {};
      var box = document.createElement('div');
      box.className = 'chat__box';
      box.innerHTML = ICON + '<div class="chat__item"><div class="typing"><span></span><span></span><span></span></div></div>';
      thread.appendChild(box);
      scrollToLatest();
      await wait(opts.typing || 900);
      var item = box.querySelector('.chat__item');
      if (opts.image) item.classList.add('chat__item--img');
      item.innerHTML = html;
      item.querySelectorAll('img').forEach(function (el) {
        el.addEventListener('load', scrollToLatest, { once: true });
      });
      scrollToLatest();
      await wait(opts.after || 500);
    }

    function sayImage(html, opts) {
      opts = opts || {};
      opts.image = true;
      opts.typing = opts.typing || 600;
      return say(html, opts);
    }

    function reply(text) {
      var box = document.createElement('div');
      box.className = 'chat__box';
      box.dataset.state = 'user';
      var item = document.createElement('div');
      item.className = 'chat__item';
      item.dataset.state = 'user';
      item.textContent = text;
      box.appendChild(item);
      thread.appendChild(box);
      scrollToLatest();
    }

    // 回答ボタンを表示し、選択された選択肢を返す
    function ask(options, cols) {
      return new Promise(function (resolve) {
        var list = document.createElement('div');
        list.className = 'chat__answer__list';
        if (cols) list.dataset.cols = cols;
        options.forEach(function (opt) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'chat__answer__item';
          btn.textContent = opt.label;
          btn.addEventListener('click', function () {
            answerArea.innerHTML = '';
            reply(opt.label);
            resolve(opt);
          }, { once: true });
          list.appendChild(btn);
        });
        answerArea.innerHTML = '';
        answerArea.appendChild(list);
        scrollToLatest();
      });
    }

    function askStart() {
      return new Promise(function (resolve) {
        var wrap = document.createElement('div');
        wrap.className = 'cta';
        wrap.innerHTML =
          '<p class="cta__lead">以下をタップして今すぐ「セルフチェック」スタート！</p>' +
          '<p class="cta__arrows" aria-hidden="true">▼▼▼</p>' +
          '<button type="button" class="img-btn">' + img(IMG.start, 'あなたの治療推奨レベルを無料診断 セルフチェックを開始する 55%OFFクーポン付き') + '</button>';
        wrap.querySelector('button').addEventListener('click', function () {
          answerArea.innerHTML = '';
          reply('セルフチェックを始める');
          resolve();
        }, { once: true });
        answerArea.innerHTML = '';
        answerArea.appendChild(wrap);
        scrollToLatest();
      });
    }

    function showLineCta() {
      var wrap = document.createElement('div');
      wrap.className = 'cta';
      wrap.innerHTML =
        '<p class="cta__lead">診断結果とクーポンはこちらから</p>' +
        '<p class="cta__arrows" aria-hidden="true">▼▼▼</p>' +
        '<a id="line-cta" class="img-btn" href="' + buildLineUrl(getSegment()) + '" data-segment="' + getSegment() + '">' +
        img(IMG.lineCta, '55％OFFクーポン付き LINE追加で診断結果を受け取る') + '</a>' +
        '<p class="cta__note">セルフチェックは無料です。<br>クーポンと診断結果を受け取るにはLINE友だち追加が必要です。</p>';
      answerArea.innerHTML = '';
      answerArea.appendChild(wrap);
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ event: 'selfcheck_complete', segment: getSegment(), concern: answers.q3 });
      scrollToLatest();
    }

    var CONCERN_MESSAGES = {
      soro: '「早さ」のお悩みも、包茎の状態とあわせてご相談いただけます。',
      smell: '「ニオイ」や衛生面のお悩みも、包茎の状態とあわせてご相談いただけます。',
      confidence: '「自信が持てない」というお悩みも、まずは今の状態を知ることが第一歩です。',
      risk: '「病気のリスク」が気になる方こそ、早めに今の状態を確認しておくと安心です。'
    };

    async function start() {
      await sayImage(img(IMG.fv, 'メンズライフクリニック', 's'), { typing: 400 });
      await say('こんなお悩み、ありませんか？' +
        '<ul class="worry-list">' +
        '<li>彼女やパートナーの視線が気になり、自信が持てない</li>' +
        '<li>包茎によるニオイなど衛生面が不安</li>' +
        '<li>服装や髪型を整えても、最後の最後で引け目を感じてしまう</li>' +
        '<li>プールや温泉など、周囲の目が気になってしまう</li>' +
        '</ul>', { after: 700 });
      await say('<span class="t-blue">1つでも心当たりがあるなら、解決のチャンス！</span><br><br>' +
        'たった3問の<span class="marker t-big">セルフチェック診断</span>に回答いただくだけで、<span class="t-red">治療推奨レベル</span>が把握できます！');
      await say('さらに、回答いただけた方限定で…' +
        '<div class="coupon">治療がお得になる<b>55%OFFの<br>LINE限定クーポン</b>を発行いたします！</div>');
      await sayImage(img(IMG.coupon, '55%OFF LINE限定クーポン', 's'));
      await askStart();

      // Q1
      await say('<span class="q-label">Q1</span><br><span class="q-text">普段、皮はかぶっているが、剥くことはできますか？</span>');
      var a1 = await ask([{ label: 'はい', value: 'yes' }, { label: 'いいえ', value: 'no' }]);
      answers.q1 = a1.value;
      await say('ご回答ありがとうございます。<br>普段は剥けるという方も、剥けない方も、<span class="marker">皮の余り方や形状は一人ひとり異なります。</span>');
      await sayImage(img(IMG.explain1a, '皮の余り方や形状は一人ひとり異なります'));
      await sayImage(img(IMG.explain1b, 'オーダーメイドの施術'));
      await say('機械的な一律の施術ではなく、熟練のスタッフがミリ単位で微調整する<span class="t-red">「オーダーメイド」</span>を採用。<br>傷跡が目立ちにくい、どこから見ても<span class="marker">自然な仕上がり</span>を実現します。', { after: 800 });

      // Q2
      await say('<span class="q-label">Q2</span><br><span class="q-text">露茎した際に、締め付けを感じますか？</span>');
      var a2 = await ask([{ label: 'はい', value: 'yes' }, { label: 'いいえ', value: 'no' }]);
      answers.q2 = a2.value;
      await sayImage(img(IMG.explain2a, '締め付け感について'));
      await say('露茎した際に締め付け感がある方は、実は<span class="t-red">重症化リスクの可能性</span>があるため、無理に剥かないようにしてください。<br><br>メンズライフクリニックでは、一人ひとりの締め付け状況に応じて<span class="marker">緻密な計算をして治療</span>します。');
      await sayImage(img(IMG.explain2b, 'お気軽にご相談ください'));
      await say('まずは今の状態をお気軽にご相談ください。<br><span class="t-blue">次が最後の質問です！</span>', { after: 800 });

      // Q3
      await say('<span class="q-label">Q3</span><br><span class="q-text">一番気になるお悩みは？</span>');
      var a3 = await ask([
        { label: '早漏を改善したい', value: 'soro' },
        { label: '臭いが気になる', value: 'smell' },
        { label: '自信を持てない', value: 'confidence' },
        { label: '病気のリスク', value: 'risk' }
      ]);
      answers.q3 = a3.value;
      await say(CONCERN_MESSAGES[a3.value]);
      await sayImage(img(IMG.explain3a, '完全プライベート空間'));
      await say('メンズライフクリニックでは、周囲の目が一切気にならない<span class="marker">完全プライベート空間</span>を徹底。<br>さらに<span class="t-red">スタッフは全員男性のみ</span>ですので、デリケートなお悩みも安心してリラックスしてご相談いただけます。');
      await sayImage(img(IMG.explain3b, 'スタッフは全員男性'));

      // 結果
      await say('<span class="t-big t-blue">診断が完了しました！</span><br>ご回答ありがとうございます。', { typing: 1600 });
      await sayImage(img(IMG.result, '診断結果'));
      await say('さあ、あなた専用の<span class="marker">『診断結果』</span>と、今すぐ使える<span class="t-red">『55%OFFクーポン』</span>を受け取ってください！');
      await sayImage(img(IMG.coupon, '55%OFF LINE限定クーポン', 's'), { after: 300 });
      showLineCta();
    }

    // 離脱防止ポップアップ（ブラウザバック時に1回だけ表示）
    var exitPopup = document.getElementById('exitPopup');
    var exitShown = false;
    try { history.pushState({ mlc: 1 }, '', location.href); } catch (e) { }
    window.addEventListener('popstate', function () {
      if (exitShown) return;
      exitShown = true;
      exitPopup.classList.add('show');
      try { history.pushState({ mlc: 1 }, '', location.href); } catch (e) { }
    });
    exitPopup.addEventListener('click', function (e) {
      if (!e.target.closest('[data-exit-close]')) return;
      exitPopup.classList.remove('show');
      scrollToLatest();
    });

    start();
  })();
</script>
